# npm coverage is maintained by scripts/security/configure_npm_security.py.
# open-pull-requests-limit 0: no routine version-update PRs on the GitHub mirrors (owner, 2026-11-10).
# Dependencies are updated in the aicom monorepo; GitHub still opens security-update PRs where they are enabled.
version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 0
  groups:
    pip-all:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 0
  groups:
    github-actions-all:
      patterns:
      - '*'
- package-ecosystem: npm
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 0
  directories:
  - /
  - /**/*
  groups:
    npm-security:
      applies-to: security-updates
      patterns:
      - '*'
    npm-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    npm-major:
      patterns:
      - '*'
      update-types:
      - major
