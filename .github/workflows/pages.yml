name: Pages — landing and live badges

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-histor
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.measure.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
      # The tests and coverage badges in the README read these two files through
      # shields.io/endpoint, so they show what this commit's run measured, not a number
      # somebody typed into the README.
      - run: npm ci --prefix scanner --no-audit --no-fund
      - run: uv sync --extra dev --project .
      - name: measure tests and coverage for the badges
        id: measure
        run: |
          set +e
          uv run --project . pytest --cov=histor --cov-branch --cov-report=json:coverage.json \
            --junitxml=junit.xml -m "not integration" -p no:warnings -q
          echo "status=$?" >> "$GITHUB_OUTPUT"
          # Written whatever happened above: a red badge is published, not skipped.
          uv run --project . python scripts/badge_json.py junit.xml coverage.json docs/landing/badges
      - run: touch docs/landing/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/landing

  # The only job that can mint an OIDC token runs no third-party code: installs and
  # tests (a pull request's dependencies included) run above without one.
  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ensure Pages source is GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "/repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
      - name: fail the run when the tests failed (after the red badge is live)
        if: needs.build.outputs.status != '0'
        run: exit 1
