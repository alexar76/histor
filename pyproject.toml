# aimarket-histor. Unprefixed short names on PyPI are claimable by strangers
# (see oracles/core/pyproject.toml). Distribution name is always aimarket-*.
[project]
name = "aimarket-histor"
version = "0.1.0"
description = "HISTOR — public transparency log of MCP tool definitions: signed MTL/1 labels over what each server advertised, when it changed, and a Merkle log anyone can audit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    # The AWR/2 reference implementation, from PyPI. It is the only code that
    # canonicalizes, digests and signs a label: HISTOR never reimplements the format.
    "awr>=2.0,<3",
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
# Production store. SQLite (the default, no extra) is for development only; HISTOR_PROFILE=prod
# refuses to start without a postgresql:// HISTOR_DATABASE_URL.
postgres = [
    "psycopg[binary,pool]>=3.2,<4",
]
# ML-DSA-65 for hybrid federation signing (HISTOR_PQC=1). A hub with
# AIMARKET_PQC_REQUIRE=1 refuses a classic-only manifest.
pqc = [
    "dilithium-py>=1.4.0",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.12,<1",
    "dilithium-py>=1.4.0",
    "psycopg[binary,pool]>=3.2,<4",
]

[project.urls]
Documentation = "https://github.com/alexar76/histor#readme"
Issues = "https://github.com/alexar76/histor/issues"
Repository = "https://github.com/alexar76/histor"
Homepage = "https://histor.modelmarket.dev/"

[project.scripts]
histor = "histor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["histor"]

[tool.hatch.build.targets.sdist]
include = [
    "/histor",
    "/scanner",
    "/tests",
    "/docs",
    "/README.md",
    "/SECURITY.md",
    "/LICENSE",
    "/Dockerfile",
    "/.dockerignore",
    "/.env.example",
    "/Makefile",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: real sockets, the real WARDEN sidecar and uvicorn; run with -m integration",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
