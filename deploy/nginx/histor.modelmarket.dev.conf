# HISTOR — public transparency log of MCP tool definitions.
# Loopback-only container from histor/docker-compose.yml (127.0.0.1:9490). nginx is the TLS edge;
# never expose 9490 on a public interface.
#
# DNS: A record  histor  →  the host you run scripts/deploy_histor.sh on.
# Install: ./scripts/deploy_histor.sh --remote <host>   (or sudo ./scripts/deploy_histor.sh on the host)

upstream histor_app { server 127.0.0.1:9490; keepalive 8; }

# /check writes nothing unless the caller opts in, but it can start a WARDEN scan: rate-limit it
# here as well as in the app. (limit_req_status is set once elsewhere on this host.)
limit_req_zone $binary_remote_addr zone=histor_check:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=histor_read:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name histor.modelmarket.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name histor.modelmarket.dev;

    client_max_body_size 2m;

    ssl_certificate     /etc/letsencrypt/live/histor.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/histor.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # Everything the desk loads is same-origin (fonts and three.js are vendored). The API is read
    # cross-origin by the GitHub Pages landing and the README badges, which CORS covers.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://img.shields.io; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/v1/check {
        limit_req zone=histor_check burst=10 nodelay;
        proxy_pass http://histor_app;
        proxy_read_timeout 60s;
    }

    location = /ai-market/v2/invoke {
        limit_req zone=histor_check burst=10 nodelay;
        proxy_pass http://histor_app;
        proxy_read_timeout 60s;
    }

    # The operator route answers only with the token; keep it off the public edge entirely.
    location ^~ /api/v1/admin/ {
        return 404;
    }

    location / {
        limit_req zone=histor_read burst=60 nodelay;
        proxy_pass http://histor_app;
    }
}
